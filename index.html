<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medina Drawing</title>
<style>
  :root { --ink: #2b2925; --paper: #f6f4ef; --chip: rgba(250, 247, 240, 0.86); --line: rgba(43, 41, 37, 0.22); }
  /* single look by choice: ink on paper in every theme */
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); }
  #paper { position: fixed; inset: 0; background-color: var(--paper); }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #ink { mix-blend-mode: multiply; }
  #cursors { pointer-events: none; }
  #status { position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%); font: italic 15px/1.4 "Iowan Old Style", Palatino, Georgia, serif;
    color: rgba(43, 41, 37, 0.6); letter-spacing: 0.04em; transition: opacity 1.2s; pointer-events: none; }
  #ui { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: center;
    max-width: calc(100vw - 32px); padding: 5px; border-radius: 12px; background: var(--chip); border: 1px solid var(--line);
    box-shadow: 0 6px 24px rgba(40, 30, 10, 0.12); font: 500 12.5px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    opacity: 0.55; transition: opacity 0.25s, transform 0.3s; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #ui:hover { opacity: 1; }
  #ui.hidden { transform: translate(-50%, 140%); opacity: 0; }
  #ui button svg { display: block; margin: 0 auto; }
  #ui button { font: inherit; color: var(--ink); background: transparent; border: 0; border-radius: 8px; padding: 7px 10px; cursor: pointer; min-width: 30px; }
  #ui button:hover { background: rgba(43, 41, 37, 0.08); }
  #ui button.on { background: var(--ink); color: #f6f1e6; }
  #ui .sep { width: 1px; height: 18px; background: var(--line); margin: 0 3px; }
  #ui .num { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
  #ui .seed { padding: 0 8px; color: rgba(43, 41, 37, 0.55); font-variant-numeric: tabular-nums; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.night { --ink: #ece6d6; --paper: #151b31; --chip: rgba(26, 32, 56, 0.86); --line: rgba(236, 230, 214, 0.2); }
  body.night #ink { mix-blend-mode: normal; }
  body.night #status { color: rgba(236, 230, 214, 0.6); }
  body.night #ui button:hover { background: rgba(236, 230, 214, 0.1); }
  body.night #ui button.on { background: var(--ink); color: #151b31; }
  body.night #ui .seed, body.night #credit { color: rgba(236, 230, 214, 0.45); }
  #credit { position: fixed; right: calc(12px + env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); font: italic 11px/1.3 "Iowan Old Style", Palatino, Georgia, serif; color: rgba(43, 41, 37, 0.45); text-align: right; pointer-events: none; }
</style>
</head>
<body>
<div id="paper"></div>
<canvas id="ink"></canvas>
<canvas id="cursors"></canvas>
<div id="status">laying the first stones&hellip;</div>
<!-- Credits: shan-shui-inf by Lingdong Huang (MIT, licence at the end of this file); see CREDITS.md. -->
<div id="ui">
  <button id="pause" title="Pause (Space)"></button>
  <span class="sep"></span>
  <button data-speed="1" title="Speed (1)">1×</button><button data-speed="2" title="Speed (2)">2×</button><button data-speed="4" title="Speed (3)">4×</button>
  <span class="sep"></span>
  <button id="names" title="Names (L)">Names</button>
  <button id="night" title="Night (M)">Night</button>
  <button id="reseed" title="New city (N)">New city</button>
  <span class="seed" id="seed" title="Seed"></span>
  <button id="full" title="Fullscreen (F)"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 4V1h3M8 1h3v3M11 8v3H8M4 11H1V8"/></svg></button>
  <button id="hide" title="Hide toolbar (H)"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.5"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
</div>
<script>

function SHANSHUI_LIB(window) {
var MEM;

  var Prng = new function() {

      var y = window.btoa(JSON.stringify(x));

      for (var i = 0; i < y.length; i++) {

  };

  };

      }
      if (x < 0) {
        x = -x;
      }
      if (y < 0) {

      }

      }

        yi = Math.floor(y),

        n2 = perlin[(of + PERLIN_YWRAP) & PERLIN_SIZE];
        n2 += rxf * (perlin[(of + PERLIN_YWRAP + 1) & PERLIN_SIZE] - n2);
        n1 += ryf * (n2 - n1);
        of += PERLIN_ZWRAP;
        n2 = perlin[of & PERLIN_SIZE];
        n2 += rxf * (perlin[(of + 1) & PERLIN_SIZE] - n2);
        n3 = perlin[(of + PERLIN_YWRAP) & PERLIN_SIZE];
        n3 += rxf * (perlin[(of + PERLIN_YWRAP + 1) & PERLIN_SIZE] - n3);

        xf *= 2;
        yi <<= 1;
        yf *= 2;
        zi <<= 1;
        zf *= 2;
        if (xf >= 1.0) {
          xi++;
          xf--;
        }

          yi++;
          yf--;
        }

          zf--;

      }

    };

      if (lod > 0) {

      }
      if (falloff > 0) {

      }
    };

        var m = 4294967296,
          a = 1664525,
          c = 1013904223,
          seed,

          setSeed: function(val) {

      for (var i = 0; i < PERLIN_SIZE + 1; i++) {
        perlin[i] = lcg.rand();
      }
    };
  }();
  // =====================================================================================
  // Medina generator: an endless hillside city of whitewashed houses, domes, minarets,
  // kasbah towers and palms, drawn as pen strokes. Written for this project.
  // Output contract (same as shan-shui-inf's, so the parser/occlusion/brush engine is shared):
  //   MEM.chunks = [{ tag, x, y (depth key: larger = nearer), canv (SVG polylines) }], sorted by y.
  //   Pen lines are ribbons tagged data-k='s'; white fills are erasers (bodies); other fills are washes.
  // =====================================================================================
  var INK, INK_FAR, INK_MID, INK_FILL, GOLD, GOLD_PALE, GOLD_INK, BLUE, BLUE_PALE, BLUE_INK, LIT, TINT, HILL_TINT, NIGHT = false;
  var WHITE = "white";
  // Day: black ink on paper. Night: chalk lines on indigo, windows lit gold, bodies faintly tinted.
  function setNight(n) {
    NIGHT = !!n;
    if (!NIGHT) {
      INK = "rgba(30,27,24,0.93)"; INK_FAR = "rgba(30,27,24,0.42)"; INK_MID = "rgba(30,27,24,0.7)"; INK_FILL = "rgba(30,27,24,0.88)";
      GOLD = "rgba(201,151,48,0.8)"; GOLD_PALE = "rgba(214,170,78,0.55)"; GOLD_INK = "rgba(150,106,24,0.95)";
      BLUE = "rgba(30,72,160,0.82)"; BLUE_PALE = "rgba(64,112,190,0.5)"; BLUE_INK = "rgba(24,56,130,0.95)";
      LIT = INK_FILL; TINT = null; HILL_TINT = null;
    } else {
      INK = "rgba(238,232,216,0.92)"; INK_FAR = "rgba(220,218,230,0.3)"; INK_MID = "rgba(232,228,216,0.6)"; INK_FILL = "rgba(7,10,24,0.9)";
      GOLD = "rgba(232,182,76,0.88)"; GOLD_PALE = "rgba(232,186,90,0.5)"; GOLD_INK = "rgba(246,206,120,0.95)";
      BLUE = "rgba(70,124,214,0.85)"; BLUE_PALE = "rgba(90,140,220,0.4)"; BLUE_INK = "rgba(150,186,246,0.95)";
      LIT = "rgba(246,196,92,0.9)"; TINT = "rgba(190,204,255,0.07)"; HILL_TINT = "rgba(4,6,18,0.4)";
    }
  }
  setNight(false);
  function OPEN() { return NIGHT && Math.random() < 0.42 ? LIT : INK_FILL; } // a window/door opening (lit at night)

  var VIEW_H = 700, GROUND = 714, ROW_DY = 50, NROWS = 11, SCALE = 1.18;

  function R(a, b) { return a + Math.random() * (b - a); }
  function RI(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function chance(p) { return Math.random() < p; }
  function wpick(opts) { // [[weight, value], ...]
    var t = 0, i;
    for (i = 0; i < opts.length; i++) t += opts[i][0];
    var r = Math.random() * t;
    for (i = 0; i < opts.length; i++) { r -= opts[i][0]; if (r <= 0) return opts[i][1]; }
    return opts[opts.length - 1][1];
  }

  // ---------------- primitives ----------------
  function poly(pl, fil, str, wid, k) {
    var c = "<polyline points='";
    for (var i = 0; i < pl.length; i++) c += " " + pl[i][0].toFixed(1) + "," + pl[i][1].toFixed(1);
    return c + "' style='fill:" + (fil || "none") + ";stroke:" + (str || fil || "none") + ";stroke-width:" + (wid || 0) + "'" + (k ? " data-k='" + k + "'" : "") + "/>";
  }
  function body(pl, tint) { // opaque white: hides what is behind, never painted (at night also a faint tint wash)
    var t = tint === undefined ? TINT : tint;
    return poly(pl, WHITE) + (t ? poly(pl, t) : "");
  }
  function wash(pl, col) { return poly(pl, col); }    // a filled colour/ink area

  function densify(pl, step) {
    var out = [pl[0]];
    for (var i = 1; i < pl.length; i++) {

  // Layout matches shan-shui's stroke(): p0, L1..Lm, pEnd, Rm..R1, p0.

        var b = dir > 0 ? [x0 + off - h, y1] : [x1 - off + h, y1];

  // hatching across a rectangle, one continuous zigzag stroke
  function hatch(x0, y0, x1, y1, step, s, col) {
    var path = [], h = y1 - y0, flip = false;
    for (var x = x0 + step * 0.5; x < x1 + h; x += step) {
      var seg = clipSeg([x, y0], [x - h * 0.7, y1], x0, y0, x1, y1);
      if (!seg) continue;
      if (flip) seg.reverse();
      flip = !flip;
      path.push(seg[0], seg[1]);
    }
    return path.length >= 2 ? pen(path, { s: s, w: 0.28, col: col || INK_MID, j: 0.2, step: 3 }) : "";
  }

  // ---------------- small parts ----------------
  function crescent(cx, cy, r, s) { // outer disc minus an inner disc offset to the right: opens to the right
    var o = [], k, a0 = 0.896, b0 = 1.35;
    for (k = 0; k <= 20; k++) { var a = a0 + (Math.PI * 2 - 2 * a0) * k / 20; o.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
    for (k = 20; k >= 0; k--) { var b = b0 + (Math.PI * 2 - 2 * b0) * k / 20; o.push([cx + 0.45 * r + Math.cos(b) * r * 0.8, cy + Math.sin(b) * r * 0.8]); }
    return wash(o, GOLD) + pen(o, { s: s, w: 0.3, col: GOLD_INK, j: 0.05, step: 2 });
  }
  function finial(cx, yb, s, gold) {
    var c = "", h = R(7, 12) * s, col = gold ? GOLD_INK : INK;

  }

  }

  if (TV) ui.style.display = "none";   // read before start() rewrites the URL to ?seed=
  document.getElementById("pause").onclick = togglePause;
  document.querySelectorAll("[data-speed]").forEach(function (el) { el.onclick = function () { setSpeed(+el.dataset.speed); }; });
  document.getElementById("names").onclick = toggleNames;
  document.getElementById("night").onclick = toggleNight;
  document.getElementById("reseed").onclick = newSeed;
  document.getElementById("full").onclick = fullscreen;
  document.getElementById("hide").onclick = toggleUI;

    else if (k === "1") setSpeed(1); else if (k === "2") setSpeed(2); else if (k === "3") setSpeed(4);
    else if (k === "l") toggleNames(); else if (k === "m") toggleNight(); else if (k === "n") newSeed();
    else if (k === "h") toggleUI(); else if (k === "f") fullscreen();

  document.addEventListener("pointerleave", function () { mouse.inside = false; });

  function instant() {
    brushes.forEach(function (b) { b.state = "idle"; b.job = null; b.item = null; });
    S.jobs.forEach(function (j) { if (j.state === "pending" && j.b[0] < S.camX + viewW) goLive(j); });
    S.jobs.forEach(function (j) {
      if (j.state !== "live") return;
      for (var i = 0; j.state === "live" && i < j.items.length; i++) {
